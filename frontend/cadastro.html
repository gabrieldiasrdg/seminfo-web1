<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro seminfo</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="cadastro">
    
    <header>
        <b>SEMINFO</b>
        <nav>
        <a href="cadastro.html">Criar Conta</a>
        </nav>
    </header>
    <main>
        <section class = "card-narrow">
            <h1>Criar Conta</h1>

            <form id="form-cadastro">
                <label for="nome">Nome</label>
                <input type="text" id="nome" required>
                
                <label for="idade">Idade:</label>
                <input type="number" id="idade" min="1" max="120" step="1" required>

                <label for="email">Email</label>
                <input type="text" id="email" required>

                <label for="senha">Senha:</label>
                <input type="password" id="senha" required>

                <label for="perfil">Perfil:</label>
                <select id="perfil" required>
                    <option value="" hidden>Selecione o Perfil</option>
                    <option value="ALUNO">ALUNO (Ouvinte)</option>
                    <option value="PROFESSOR">PROFESSOR (Apresentador) </option>
                    <option value="EXTERNO">EXTERNO (Ouvinte ou Apresentador)</option>
                </select>
                <div id="campos-alunos">
                    <label for="matricula">Matrícula</label>
                    <input type="text" id="matricula" required>

                    <label for="curso">Curso</label>
                    <input type="text" id="curso" required>
                    
                    <label for="instituicao">Instituição</label>
                    <input type="text" id="instituicao" required>
                </div>
                <p>
                <button>Cadastrar</button>
                <a href="login.html">Voltar ao login</a>
                </p>
            </form>

        </section>
    </main>
    <script src ="js/script.js"></script>
</body>
</html>
