<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Participantes seminfo</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="participantes">
    <header>
        <b>SEMINFO</b>
        <nav>
            <a href="index.html">Início</a>
            <a href="admin.html">Eventos</a>
            <a href="#" id="sair">Sair</a>
        </nav>
    </header>

    <main>
        <section class="card">
            <h1>Participantes</h1>
            <p class="muted">
                Os registros vem do MySQL.
                Somente admin podem editar e excluir
            </p>
            <p id="msg" class="msg"></p>
            <div class="table-wrap">
                <table>
                    <tr>
                        <th>Nome</th>
                        <th>Idade</th>
                        <th>Email</th>
                        <th>Perfil</th>
                        <th>Curso</th>
                        <th>Matrícula</th>
                        <th>Evento</th>
                        <th>Ações</th>
                    </tr>
                </table>
                <tbody id="tabela-participantes"></tbody>
            </div>
        </section>
        <section class = "card-narrow">
            <h1>Criar Conta</h1>

            <form id="form-editar">
                <label for="nome">Nome</label>
                <input type="text" id="nome" required>
                
                <label for="idade">Idade:</label>
                <input type="number" id="idade" min="1" max="120" step="1" required>

                <label for="email">Email</label>
                <input type="text" id="email" required>

                <label for="senha">Senha:</label>
                <input type="password" id="senha" required>

                <div id="campos-alunos">
                    <label for="matricula">Matrícula</label>
                    <input type="text" id="matricula" required>

                    <label for="curso">Curso</label>
                    <input type="text" id="curso" required>
                </div>
                <button type="button" class="light" id="cancelar-edicao">Cancelar</button>
                <button type="submit">Salvar alterações</button>
            </form>
        </section>
    </main>
    <script src="js/app.js"></script>
</body>
</html>
